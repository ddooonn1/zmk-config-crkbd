# === Power Management ===

# Deep sleep — enters ultra-low-power mode after idle timeout
CONFIG_ZMK_SLEEP=y

# Idle timeout — blank OLED after 5 seconds of inactivity
CONFIG_ZMK_IDLE_TIMEOUT=5000

# Deep sleep timeout — full sleep after 5 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# === Bluetooth ===

# TX power — default (0 dBm) is plenty for desk distance (<1m)
# Removed CONFIG_BT_CTLR_TX_PWR_PLUS_8=y to save power per transmission

# Better BLE pairing
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# === Display ===

# OLED display enabled (blanks on idle via timeout above)
CONFIG_ZMK_DISPLAY=y

# === Input ===

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# === Debug (off) ===
# CONFIG_ZMK_USB_LOGGING=y